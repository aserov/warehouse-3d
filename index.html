<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse 3D</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Top Static Toolbar -->
  <header id="top-toolbar">
    <div class="toolbar-brand">
      <svg class="cube-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span class="toolbar-title" data-i18n="appTitle">Warehouse 3D</span>
    </div>
    <div class="toolbar-time" id="toolbar-clock">
      Loading time...
    </div>
  </header>

  <!-- Main Layout Container -->
  <div id="main-layout">
    <!-- Canvas Area -->
    <main id="canvas-container">

      <!-- Left Canvas Overlay Controls (Compass & Zoom) -->
      <div class="canvas-controls-left">
        <!-- Compass Widget -->
        <div class="compass-widget" id="compass-widget">
          <div class="compass-dial">
            <button class="compass-btn btn-n" data-angle="0" title="North (0°)">N</button>
            <button class="compass-btn btn-e" data-angle="90" title="East (90°)">E</button>
            <button class="compass-btn btn-s" data-angle="180" title="South (180°)">S</button>
            <button class="compass-btn btn-w" data-angle="270" title="West (270°)">W</button>
            <div class="compass-center">
              <div class="compass-arrow" id="compass-arrow"></div>
            </div>
          </div>
        </div>

        <!-- Zoom Controls -->
        <div class="zoom-widget" id="zoom-widget">
          <button id="zoom-out-btn" class="zoom-btn" title="Zoom Out">−</button>
          <div class="zoom-slider-container">
            <input type="range" id="zoom-slider" min="0" max="100" value="50" class="zoom-slider">
          </div>
          <button id="zoom-in-btn" class="zoom-btn" title="Zoom In">+</button>
        </div>
      </div>

      <!-- Right Side Controls (Cell Search, Floor Select, Area Select, 2D | 3D | Reset Widget) -->
      <div class="canvas-controls-right">
        <div class="view-mode-widget">

          <!-- Cell Search Box Widget -->
          <div class="cell-search-widget" id="cell-search-widget">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="cell-search-input" placeholder="Search cell..." autocomplete="off">
              <button id="search-clear-btn" class="search-clear-btn" type="button" style="display: none;">✕</button>
            </div>

            <!-- Auto-complete Popup Menu -->
            <div class="search-dropdown-menu" id="search-dropdown-menu"></div>
          </div>

          <div class="view-mode-divider"></div>

          <!-- Custom Warehouse Dropdown -->
          <div class="custom-floor-select" id="custom-warehouse-select">
            <button class="floor-select-btn" id="warehouse-select-btn" type="button">
              <svg class="floor-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 8.35V20a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8.35a1 1 0 0 1 .53-.88l8-4.44a1 1 0 0 1 .94 0l8 4.44a1 1 0 0 1 .53.88Z"></path>
                <path d="M6 21V11h12v10"></path>
              </svg>
              <span class="floor-current-text" id="warehouse-current-text">Warehouse</span>
              <svg class="floor-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>

            <div class="floor-dropdown-menu" id="warehouse-dropdown-menu"></div>
          </div>

          <div class="view-mode-divider"></div>

          <!-- Custom Floor Dropdown -->
          <div class="custom-floor-select" id="custom-floor-select">
            <button class="floor-select-btn" id="floor-select-btn" type="button">
              <svg class="floor-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span class="floor-current-text" id="floor-current-text">Floor 1</span>
              <svg class="floor-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>

            <div class="floor-dropdown-menu" id="floor-dropdown-menu">
            </div>
          </div>

          <div class="view-mode-divider"></div>

          <!-- Custom Area/Zone Dropdown -->
          <div class="custom-floor-select" id="custom-area-select">
            <button class="floor-select-btn" id="area-select-btn" type="button">
              <svg class="floor-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
              <span class="floor-current-text" id="area-current-text">All Areas</span>
              <svg class="floor-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>

            <div class="floor-dropdown-menu" id="area-dropdown-menu">
              <div class="floor-option active" data-value="all">All Areas</div>
            </div>
          </div>

          <div class="view-mode-divider"></div>

          <!-- Mode Toggle (2D / 3D) -->
          <button id="btn-2d" class="view-mode-btn">2D</button>
          <button id="btn-3d" class="view-mode-btn active">3D</button>

          <div class="view-mode-divider"></div>

          <!-- Reset View Button -->
          <button id="btn-reset-view" class="view-mode-btn icon-btn" title="Reset View">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>

        </div>
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside id="sidebar">

      <!-- Section 1: Information -->
      <section class="sidebar-section info-section">
        <h3 class="section-title" data-i18n="infoTitle">Information</h3>
        <div id="info-content" data-i18n="defaultInfoText">Click on a cell, row, or area to view details.</div>
      </section>

      <!-- Section 2: Settings -->
      <section class="sidebar-section settings-section">
        <h3 class="section-title" data-i18n="settingsTitle">Settings</h3>
        <div class="checkbox-group">
          <label data-i18n="showAreaLabels"><input type="checkbox" id="toggle-area-labels" checked> Show Area Labels</label>
          <label data-i18n="showRowLabels"><input type="checkbox" id="toggle-row-labels" checked> Show Row Labels</label>
          <label data-i18n="showLevelLabels"><input type="checkbox" id="toggle-level-labels" checked> Show Level Labels</label>
          <label data-i18n="showCompass"><input type="checkbox" id="toggle-compass" checked> Show Compass</label>
          <label data-i18n="showZoom"><input type="checkbox" id="toggle-zoom" checked> Show Zoom</label>
        </div>
      </section>

      <!-- Section 3: Help -->
      <section class="sidebar-section help-section">
        <h3 class="section-title" data-i18n="helpTitle">Navigation Help</h3>
        <div class="help-list">
          <div data-i18n="helpRotate">Rotate: Left click + Drag</div>
          <div data-i18n="helpPan">Pan: Right click + Drag</div>
          <div data-i18n="helpZoom">Zoom: Mouse wheel</div>
        </div>
      </section>

    </aside>
  </div>

  <!-- Libraries & Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="js/i18n/ru.js"></script>
  <script src="js/i18n/en.js"></script>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sceneSetup.js"></script>
  <script src="js/layoutEngine.js"></script>
  <script src="js/warehouseBuilder.js"></script>
  <script src="js/cameraController.js"></script>
  <script src="js/uiController.js"></script>
  <script src="js/toolbarClock.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
