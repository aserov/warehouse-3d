<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse 3D</title>

  <!-- Modular CSS Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/compass.css">
  <link rel="stylesheet" href="css/zoom.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/fps.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Top Static Toolbar -->
  <header id="top-toolbar">
    <div class="toolbar-brand">
      <svg class="cube-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span class="toolbar-title" data-i18n="appTitle">Warehouse 3D</span>
    </div>
    <div class="toolbar-time" id="toolbar-clock">
      Thu Jan 01 1970 00:00:00 (Universal Standard Time)
    </div>
  </header>

  <!-- Main Layout Container -->
  <div id="main-layout">
    <!-- Canvas Area -->
    <main id="canvas-container">

      <!-- Left Canvas Overlay Controls (Compass & Zoom) -->
      <div class="canvas-controls-left">
        <!-- Compass Widget -->
        <div class="compass-widget" id="compass-widget">
          <div class="compass-dial">
            <button class="compass-btn btn-e" data-angle="270" title="East (90°)">E</button>
            <button class="compass-btn btn-s" data-angle="180" title="South (180°)">S</button>
            <button class="compass-btn btn-w" data-angle="90" title="West (270°)">W</button>
            <button class="compass-btn btn-n" data-angle="0" title="North (0°)">N</button>
            <div class="compass-center">
              <div class="compass-arrow" id="compass-arrow"></div>
            </div>
          </div>
        </div>

        <!-- Zoom Controls -->
        <div class="zoom-widget" id="zoom-widget">
          <button id="zoom-out-btn" class="zoom-btn" title="Zoom Out">−</button>
          <div class="zoom-slider-container">
            <input type="range" id="zoom-slider" min="0" max="100" value="50" class="zoom-slider">
          </div>
          <button id="zoom-in-btn" class="zoom-btn" title="Zoom In">+</button>
        </div>
      </div>

      <!-- Right Side Controls -->
      <div class="canvas-controls-right">

        <!-- Top Widget: Mode Toggle (2D / 3D) & Reset View -->
        <div class="view-mode-widget mode-toggle-widget" id="canvas-viewer-widget">

          <!-- Fullscreen Toggle Button -->
          <button id="btn-fullscreen" class="view-mode-btn icon-btn" title="Toggle Fullscreen">
            <svg class="icon-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <svg class="icon-compress" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
            </svg>
          </button>

          <div class="view-mode-divider"></div>

          <button id="btn-2d" class="view-mode-btn">2D</button>
          <button id="btn-3d" class="view-mode-btn active">3D</button>
          <button id="btn-fps" class="view-mode-btn">FPS</button>

          <div class="view-mode-divider"></div>

          <!-- Reset View Button -->
          <button id="btn-reset-view" class="view-mode-btn icon-btn" title="Reset View">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>

        <!-- Bottom Widget: Filters (Warehouse, Floor, Area, Cell Search) -->
        <div class="view-mode-widget filters-widget">

          <!-- Cell Search Box Widget -->
          <div class="cell-search-widget" id="cell-search-widget">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="cell-search-input" placeholder="Search cell..." autocomplete="off">
              <button id="search-clear-btn" class="search-clear-btn" type="button" style="display: none;">✕</button>
            </div>
            <div class="search-dropdown-menu" id="search-dropdown-menu"></div>
          </div>

          <div class="view-mode-divider"></div>

          <!-- Custom Warehouse Dropdown (Perspective Hangar / Warehouse Icon) -->
          <div class="custom-floor-select" id="custom-warehouse-select">
            <button class="floor-select-btn" id="warehouse-select-btn" type="button">
              <svg class="floor-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 20V10l10-6 10 6v10H2z"></path>
                <path d="M9 20v-5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5"></path>
              </svg>
              <span class="floor-current-text" id="warehouse-current-text"></span>
              <svg class="floor-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>

            <div class="floor-dropdown-menu" id="warehouse-dropdown-menu"></div>
          </div>

          <!-- Custom Floor Dropdown (Stacked Layers Icon) -->
          <div class="custom-floor-select" id="custom-floor-select">
            <button class="floor-select-btn" id="floor-select-btn" type="button">
              <svg class="floor-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 12 12 17 22 12"></polyline>
                <polyline points="2 17 12 22 22 17"></polyline>
              </svg>
              <span class="floor-current-text" id="floor-current-text"></span>
              <svg class="floor-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>

            <div class="floor-dropdown-menu" id="floor-dropdown-menu"></div>
          </div>

          <!-- Custom Area/Zone Dropdown (Quadrants Grid Icon) -->
          <div class="custom-floor-select" id="custom-area-select">
            <button class="floor-select-btn" id="area-select-btn" type="button">
              <svg class="floor-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              </svg>
              <span class="floor-current-text" id="area-current-text"></span>
              <svg class="floor-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>

            <div class="floor-dropdown-menu" id="area-dropdown-menu"></div>
          </div>

        </div>
      </div>

      <!-- FPS: Scanner hand + crosshair -->
      <div id="fps-scanner-overlay" class="fps-overlay hidden">
        <!-- Center crosshair dot -->
        <div class="fps-crosshair"></div>

        <!-- Scanner PNG image container -->
        <div class="scanner-hand">
          <img src="assets/scanner-hand.png" alt="Scanner" class="scanner-img" />
        </div>

        <!-- Exit hint -->
        <div class="fps-hint">Press <b class="fps-hint-esc">ESC</b> to exit FPS mode</div>
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside id="sidebar">

      <!-- Section 1: information (Expanded by default) -->
      <section class="sidebar-section info-section">
        <h3 class="section-title">
          <span data-i18n="infoTitle">Information</span>
          <svg class="collapse-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </h3>
        <div class="section-content" id="info-content" data-i18n="defaultInfoText">Click on a cell, row, or area to view details.</div>
      </section>

      <!-- Section 2: Settings (Collapsed by default) -->
      <section class="sidebar-section settings-section collapsed">
        <h3 class="section-title">
          <span data-i18n="settingsTitle">Settings</span>
          <svg class="collapse-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </h3>
        <div class="section-content checkbox-group">
          <label data-i18n="showFloorLabels"><input type="checkbox" id="toggle-floor-labels" checked> Show Floor Labels</label>
          <label data-i18n="showAreaLabels"><input type="checkbox" id="toggle-area-labels" checked> Show Area Labels</label>
          <label data-i18n="showRowLabels"><input type="checkbox" id="toggle-row-labels" checked> Show Row Labels</label>
          <label data-i18n="showLevelLabels"><input type="checkbox" id="toggle-level-labels" checked> Show Level Labels</label>
          <label data-i18n="showCornerLabels"><input type="checkbox" id="toggle-corner-labels" checked> Show Corner Coordinates</label>
          <label data-i18n="showCanvasViewer"><input type="checkbox" id="toggle-canvas-viewer" checked> Show Canvas Viewer</label>
          <label data-i18n="showCompass"><input type="checkbox" id="toggle-compass" checked> Show Compass</label>
          <label data-i18n="showZoom"><input type="checkbox" id="toggle-zoom" checked> Show Zoom</label>
        </div>
      </section>

      <!-- Section 3: Help (Collapsed by default) -->
      <section class="sidebar-section help-section collapsed">
        <h3 class="section-title">
          <span data-i18n="helpTitle">Navigation Help</span>
          <svg class="collapse-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </h3>
        <div class="section-content help-list">
          <div data-i18n="helpRotate">Rotate: Left click + Drag</div>
          <div data-i18n="helpPan">Pan: Right click + Drag</div>
          <div data-i18n="helpZoom">Zoom: Mouse wheel</div>
        </div>
      </section>

    </aside>
  </div>

  <!-- Libraries & Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="js-v2/i18n/ru.js"></script>
  <script src="js-v2/i18n/en.js"></script>

  <script src="js-v2/config/enums.js"></script>
  <script src="js-v2/config/warehouseConfig.js"></script>
  <script src="js-v2/config/settingsConfig.js"></script>

  <script src="js-v2/utils/color.js"></script>
  <script src="js-v2/utils/format.js"></script>
  <script src="js-v2/utils/scale.js"></script>
  <script src="js-v2/utils/metrics.js"></script>
  <script src="js-v2/utils/i18n.js"></script>
  <script src="js-v2/utils/eventBus.js"></script>

  <script src="js-v2/api/warehouseApi.js"></script>
  <script src="js-v2/toolbar/toolbarClock.js"></script>

  <script src="js-v2/app.js"></script>
</body>
</html>
